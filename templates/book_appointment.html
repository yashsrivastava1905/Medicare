{% extends "base.html" %}
{% block title %}Book Appointment - Medicare{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Book Appointment with Dr. {{ doctor.user.name }}</h2>
    <p class="specialization">{{ doctor.specialization }}</p>

    <form method="POST">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" required>
        </div>
        <div class="form-group">
            <label>Time</label>
            <input type="time" name="time" required>
        </div>
        <div class="form-group">
            <label>Notes (optional)</label>
            <textarea name="notes" rows="3" placeholder="Describe your symptoms or reason for visit"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Confirm Booking</button>
    </form>
</div>
{% endblock %}
